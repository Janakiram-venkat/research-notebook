# Runs the tests on every push and pull request. On a push to main, if everything
# passes, deploys to the AWS server over SSH (see docs/DEPLOY_AWS.md, "Auto-deploy").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    # Builds the production image and checks it starts and answers /api/health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-notebook .
      - name: Smoke test the container
        run: |
          docker run -d --name nb -p 8000:8000 -e NB_SECRET_KEY=ci-only research-notebook
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs nb
          exit 1

  deploy:
    needs: [frontend, backend, docker]
    # Off until the server exists: set the repo variable DEPLOY_ENABLED=true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Back up, pull and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" DOMAIN="$DOMAIN" bash -s <<'EOF'
          set -euo pipefail
          cd ~/research-notebook
          compose="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          # Backup before the database upgrades itself on start.
          $compose exec -T notebook python scripts/backup.py /data/pre-deploy.db || echo "no running container to back up"
          git fetch origin main
          git reset --hard origin/main
          $compose up -d --build
          docker image prune -f
          EOF
      - name: Check the live site
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health"; then exit 0; fi
            sleep 2
          done
          echo "Site did not come back healthy" && exit 1
